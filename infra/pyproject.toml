[project]
name = "scrumation-infra"
version = "0.1.0"
description = "Scrumation AWS infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = ["aws-cdk-lib>=2.200,<3", "constructs>=10,<11"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrumation_infra"]
