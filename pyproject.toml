[project]
name = "scrumation-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
]

[tool.uv]
required-version = "==0.12.13"

[tool.uv.workspace]
members = ["services/api", "infra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src", "infra/src", "infra/tests", "scripts/check_repo.py"]

[tool.pytest.ini_options]
testpaths = ["infra/tests"]
addopts = "--strict-markers --strict-config"
