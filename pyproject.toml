[project]
name = "scrumation-workspace"
version = "0.1.0"
requires-python = ">=3.12.16,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.3,<1",
    "mypy>=2.4.1,<3",
    "pytest>=9.2,<10",
    "hatchling==1.33.0",
    "pip>=26.2.2,<27",
    "pip-audit>=2.10.1,<3",
]

[tool.uv]
required-version = "==0.13.6"
constraint-dependencies = ["botocore>=1.43.117", "certifi>=2026.10.19", "pip>=26.2.2"]

[tool.uv.workspace]
members = ["services/api", "infra"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/api/src", "infra/src", "infra/tests", "tests/security", "scripts/check_repo.py", "scripts/check_trust.py"]

[tool.pytest.ini_options]
testpaths = ["infra/tests", "tests/security"]
addopts = "--strict-markers --strict-config"
