name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Update system CA and NSS trust stores
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates libnss3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install pinned npm
        run: npm install --global npm@12.2.1
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen --all-packages
      - name: Validate source, tests, build, and infrastructure
        run: npm run check
      - name: Audit dependencies
        run: npm run audit
      - name: Install Chromium and system dependencies
        run: npm exec -- playwright install --with-deps chromium
      - name: Check browser routes and accessibility
        run: npm run test:browser
